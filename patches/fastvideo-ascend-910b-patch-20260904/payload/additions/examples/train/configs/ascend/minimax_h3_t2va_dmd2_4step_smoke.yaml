# Engineering bring-up: one Dense DMD2 optimizer step for a four-forward H3
# student. This validates mechanics, checkpointing and export; it is not the
# unpublished FastH3 quality recipe.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /hpc-to-ds-0115/x00876811/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /hpc-to-ds-0115/x00876811/models/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /hpc-to-ds-0115/x00876811/models/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA

method:
  _target_: fastvideo.train.methods.distribution_matching.minimax_h3_dmd2.MiniMaxH3DMD2Method
  rollout_mode: simulate
  generator_update_interval: 1
  real_score_guidance_scale: 1.0
  dmd_denoising_steps: [999, 749, 500, 250]
  min_timestep_ratio: 0.02
  max_timestep_ratio: 0.98
  fake_score_learning_rate: 1.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 8
    sp_size: 8
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8
    pin_cpu_memory: false
    fsdp_cpu_offload: true
  data:
    data_path: data/crush-smol_h3_t2va_single_sample_preprocessed
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124
  optimizer:
    learning_rate: 1.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.0
    lr_scheduler: constant
    lr_warmup_steps: 0
  loop:
    max_train_steps: 1
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: runs/ascend_minimax_h3_dense_dmd2_4step_smoke
    training_state_checkpointing_steps: 1
    checkpoints_total_limit: 1
  tracker:
    trackers: [none]
    project_name: fastvideo_minimax_h3
    run_name: ascend_910b_dense_dmd2_4step_smoke
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline: {}
